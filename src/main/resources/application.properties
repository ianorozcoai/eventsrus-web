spring.application.name=eventsrus-web
server.port=8081

# Thymeleaf - disable caching in dev so template edits show up without a restart
spring.thymeleaf.cache=false

# eventsrus-backend base URL (not called yet - JSON stubs are used for now,
# see src/main/resources/stubs/). Wired up once the backend integration starts.
eventsrus.backend.base-url=http://localhost:8080

# Google Sign-In - must be the SAME OAuth client ID eventsrus-backend verifies
# ID tokens against (google.oauth.client-id in its own application.properties).
google.oauth.client-id=590594963033-29a013v91o79jnf72pkcdnvf6ue3egej.apps.googleusercontent.com

# reCAPTCHA v3 - vendor onboarding only for now (see vendor/onboarding.html).
# Site key is public/safe to embed client-side, same as any reCAPTCHA site key.
recaptcha.site-key=6Ld3Aa0tAAAAABmnpL31_yvS7gjig7K5Bqo7Wu4k

# Multipart uploads - every file the vendor picks (logo, ID card, selfie,
# legal documents, policy PDFs, package photos, payment QR codes) passes
# through THIS app first before being forwarded to eventsrus-backend, so
# its own limit applies before the backend's ever does. Spring Boot's
# default (1MB per file, 10MB per request) is well below the backend's own
# r2-upload limits (see eventsrus-backend's spring.servlet.multipart.*) and
# silently rejects any real phone photo with a generic error page before
# the request ever reaches a controller - match the backend's limits here.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
