spring.application.name=eventsrus-web
server.port=8081

# Thymeleaf - disable caching in dev so template edits show up without a restart
spring.thymeleaf.cache=false

# eventsrus-backend base URL (not called yet - JSON stubs are used for now,
# see src/main/resources/stubs/). Wired up once the backend integration starts.
eventsrus.backend.base-url=http://localhost:8080

# Google Sign-In - must be the SAME OAuth client ID eventsrus-backend verifies
# ID tokens against (google.oauth.client-id in its own application.properties).
google.oauth.client-id=590594963033-29a013v91o79jnf72pkcdnvf6ue3egej.apps.googleusercontent.com
