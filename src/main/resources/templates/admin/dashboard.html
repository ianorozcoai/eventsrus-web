<!DOCTYPE html>
<html lang="en" dir="ltr" class="layout-static" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Dashboard - EventsRUs Admin')}"></head>

<body>

	<div th:replace="~{fragments/admin-shell :: topnavbar}"></div>

	<!-- Page content -->
	<div class="page-content">

		<div th:replace="~{fragments/admin-shell :: sidebar('dashboard')}"></div>

		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Inner content -->
			<div class="content-inner">

				<!-- Page header -->
				<div class="page-header page-header-light shadow">
					<div class="page-header-content d-lg-flex">
						<div class="d-flex">
							<h4 class="page-title mb-0">Dashboard</h4>
						</div>
					</div>
				</div>
				<!-- /page header -->

				<!-- Content area -->
				<div class="content">

					<div th:if="${backendUnavailable}" class="alert alert-warning d-flex align-items-center">
						<i class="ph-plugs me-3"></i>
						<span>Not connected to eventsrus-backend right now - log out and back in to retry.</span>
					</div>

					<div class="row" th:unless="${backendUnavailable}">

						<div class="col-md-6 col-xl-4">
							<div class="card">
								<div class="card-body d-flex align-items-center">
									<div>
										<h3 class="mb-0" th:text="${plannerCount}">0</h3>
										<div class="text-muted">Total Planners</div>
									</div>
									<i class="ph-users ph-2x ms-auto opacity-50"></i>
								</div>
							</div>
						</div>

						<div class="col-md-6 col-xl-4">
							<div class="card">
								<div class="card-body d-flex align-items-center">
									<div>
										<h3 class="mb-0" th:text="${vendorCount}">0</h3>
										<div class="text-muted">Total Vendors</div>
									</div>
									<i class="ph-storefront ph-2x ms-auto opacity-50"></i>
								</div>
							</div>
						</div>

						<div class="col-md-6 col-xl-4">
							<div class="card">
								<div class="card-body d-flex align-items-center">
									<div>
										<h3 class="mb-0" th:text="${vendorTicketCount}">0</h3>
										<div class="text-muted">Vendor Tickets</div>
									</div>
									<i class="ph-lifebuoy ph-2x ms-auto opacity-50"></i>
								</div>
							</div>
						</div>

						<div class="col-md-6 col-xl-4">
							<div class="card">
								<div class="card-body d-flex align-items-center">
									<div>
										<h3 class="mb-0" th:text="${newVendorTicketCount}">0</h3>
										<div class="text-muted">New Vendor Tickets</div>
									</div>
									<i class="ph-bell-ringing ph-2x ms-auto opacity-50"></i>
								</div>
							</div>
						</div>

						<div class="col-md-6 col-xl-4">
							<div class="card">
								<div class="card-body d-flex align-items-center">
									<div>
										<h3 class="mb-0" th:text="${newPlannerTicketCount}">0</h3>
										<div class="text-muted">New Planner Tickets</div>
									</div>
									<i class="ph-bell-ringing ph-2x ms-auto opacity-50"></i>
								</div>
							</div>
						</div>

						<div class="col-md-6 col-xl-4">
							<div class="card">
								<div class="card-body d-flex align-items-center">
									<div>
										<h3 class="mb-0" th:text="${incompleteVendorSignupCount}">0</h3>
										<div class="text-muted">Incomplete Vendor Sign-ups</div>
									</div>
									<i class="ph-hourglass-medium ph-2x ms-auto opacity-50"></i>
								</div>
							</div>
						</div>

					</div>
				</div>
				<!-- /content area -->

				<!-- Footer -->
				<div class="navbar navbar-sm navbar-footer border-top">
					<div class="container-fluid">
						<span>&copy; 2026 EventsRUs</span>
					</div>
				</div>
				<!-- /footer -->

			</div>
			<!-- /inner content -->

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

</body>
</html>
