<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
    One selected category's result row - "Search Result" (formerly step 3),
    one per category checked in step 2. A "Browse" button opens a pop-up
    (#categoryModal-<TYPE> below) listing that category's matched
    suppliers, rather than showing them inline.
      group   - a PlannerController.SupplierGroup, already filtered to
                selected()==true by the caller (selectedSupplierGroups)
      eventId - current event id (storefront link's ?eventId= lead tracking)
*/-->
<div th:fragment="categoryResultRow(group, eventId)">
    <div class="list-group-item d-flex align-items-center py-2">
        <span class="fw-semibold flex-grow-1" th:text="${group.label()}">Catering</span>
        <span class="badge bg-secondary text-white ms-2" th:text="${group.matchCount()}">46</span>
        <button type="button" class="btn btn-sm btn-primary ms-3 flex-shrink-0"
                data-bs-toggle="modal" th:attr="data-bs-target=|#categoryModal-${group.type()}|">
            Browse
        </button>
        <!--/* Removing a category outright (not unchecking - there's no
             checkbox here anymore) deletes its checklist items too, so
             this gets its own confirmation and its own icon, distinct
             from Browse. See events.html's script block. */-->
        <button type="button" class="btn btn-sm btn-icon btn-outline-danger ms-2 flex-shrink-0 categoryRemoveBtn"
                th:attr="data-type=${group.type()},data-label=${group.label()}"
                title="Remove category" aria-label="Remove category">
            <i class="ph-trash"></i>
        </button>
    </div>

    <!--/* The pop-up itself - rendered right alongside its row (modals can
         live anywhere in the DOM), one per selected category. */-->
    <div class="modal fade" th:id="|categoryModal-${group.type()}|" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${group.label()}">Catering</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-0" th:if="${group.matchCount() == 0}">
                        No matching suppliers in this area yet - check back later.
                    </p>
                    <ul class="list-group list-group-flush" th:if="${group.matchCount() > 0}">
                        <li th:each="vendor : ${group.vendors()}" class="list-group-item d-flex align-items-center py-2">
                            <img th:if="${vendor.logoImageUrl() != null}" th:src="${vendor.logoImageUrl()}" alt="Logo"
                                 class="rounded-circle border flex-shrink-0" style="width:32px;height:32px;object-fit:cover;">
                            <span th:if="${vendor.logoImageUrl() == null}"
                                  class="d-flex align-items-center justify-content-center rounded-circle bg-light text-muted flex-shrink-0"
                                  style="width:32px;height:32px;">
                                <i class="ph-storefront"></i>
                            </span>

                            <div class="ms-2 flex-grow-1 overflow-hidden">
                                <div class="fw-semibold text-truncate" th:text="${vendor.businessName()}">Business name</div>
                                <!--/* No Top Supplier/Verified badges here - same reasoning as
                                     the name-search rows (see that fragment below): most
                                     vendors in this marketplace aren't registered businesses
                                     and never clear verification. Business type(s) instead -
                                     same category this modal is already grouped by, plus any
                                     others the vendor also covers. */-->
                                <div class="fs-sm text-muted text-truncate" th:if="${vendor.businessTypes() != null and not #lists.isEmpty(vendor.businessTypes())}">
                                    <span th:each="type, iter : ${vendor.businessTypes()}">
                                        <span th:text="${type.label}">Catering</span><span th:if="${!iter.last}">, </span>
                                    </span>
                                </div>
                                <div class="d-flex align-items-center flex-wrap gap-1">
                                    <span th:if="${vendor.reviewCount() > 0}" class="text-warning fs-sm fw-semibold"
                                          th:title="${vendor.reviewCount()} + ' review(s)'">
                                        <i class="ph-star"></i>
                                        <span th:text="${vendor.averageRating()}">4.8</span>
                                        <span class="text-muted fw-normal">(<span th:text="${vendor.reviewCount()}">12</span>)</span>
                                    </span>
                                </div>
                            </div>

                            <a th:href="@{'/vendor/storefront/' + ${vendor.slug()}(eventId=${eventId},category=${group.type()})}" target="_blank"
                               class="btn btn-primary btn-sm flex-shrink-0 ms-2">View Supplier</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!--/*
    One flat result row for a name search (Search for a Specific Supplier) -
    same visual language as #categorySupplierSection's vendor rows above,
    just not nested in a category group since a name search isn't grouped
    by type.
      vendor  - a PlannerVendorSuggestion
      eventId - current event id (storefront link's ?eventId= lead tracking)
*/-->
<li th:fragment="supplierSearchResultRow(vendor, eventId)"
    class="list-group-item d-flex align-items-center py-2">

    <img th:if="${vendor.logoImageUrl() != null}" th:src="${vendor.logoImageUrl()}" alt="Logo"
         class="rounded-circle border flex-shrink-0" style="width:32px;height:32px;object-fit:cover;">
    <span th:if="${vendor.logoImageUrl() == null}"
          class="d-flex align-items-center justify-content-center rounded-circle bg-light text-muted flex-shrink-0"
          style="width:32px;height:32px;">
        <i class="ph-storefront"></i>
    </span>

    <div class="ms-2 flex-grow-1 overflow-hidden">
        <div class="fw-semibold text-truncate" th:text="${vendor.businessName()}">Business name</div>
        <!--/* A name-search result isn't grouped under one category the way
             the matched-category modal's rows are, and a vendor can carry
             several business types - list them all so "what kind of
             supplier is this" doesn't require opening their storefront. */-->
        <div class="fs-sm text-muted text-truncate" th:if="${vendor.businessTypes() != null and not #lists.isEmpty(vendor.businessTypes())}">
            <span th:each="type, iter : ${vendor.businessTypes()}">
                <span th:text="${type.label}">Catering</span><span th:if="${!iter.last}">, </span>
            </span>
        </div>
        <!--/* No Top Supplier/Verified badges here, unlike the matched-
             category modal's rows - a name search reaches every vendor by
             design, most of whom aren't registered businesses and so never
             clear verification, so the badges would read as "most results
             are flagged" friction rather than useful signal. */-->
        <div class="d-flex align-items-center flex-wrap gap-1">
            <span class="text-muted fs-sm" th:if="${vendor.city() != null}" th:text="${vendor.city()}">City</span>
            <span th:if="${vendor.reviewCount() > 0}" class="text-warning fs-sm fw-semibold"
                  th:title="${vendor.reviewCount()} + ' review(s)'">
                <i class="ph-star"></i>
                <span th:text="${vendor.averageRating()}">4.8</span>
                <span class="text-muted fw-normal">(<span th:text="${vendor.reviewCount()}">12</span>)</span>
            </span>
        </div>
    </div>

    <a th:href="@{'/vendor/storefront/' + ${vendor.slug()}(eventId=${eventId})}" target="_blank"
       class="btn btn-primary btn-sm flex-shrink-0 ms-2">View Supplier</a>
</li>

</body>
</html>
