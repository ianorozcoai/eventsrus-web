<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title th:text="${intent == 'vendor'} ? 'Vendor Login - EventsRUs' : 'Planner Login - EventsRUs'">Login - EventsRUs</title>

	<!-- Global stylesheets -->
	<link th:href="@{/assets/fonts/inter/inter.css}" rel="stylesheet" type="text/css">
	<link th:href="@{/assets/icons/phosphor/styles.min.css}" rel="stylesheet" type="text/css">
	<link th:href="@{/assets/css/all.min.css}" id="stylesheet" rel="stylesheet" type="text/css">
	<!-- /global stylesheets -->

	<!-- Core JS files -->
	<script th:src="@{/assets/js/bootstrap/bootstrap.bundle.min.js}"></script>
	<!-- /core JS files -->

	<!-- Google Identity Services - the browser-side half of the one real
	     login flow in this app; see AuthWebController for the server half. -->
	<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-body">

	<div class="d-flex flex-column min-vh-100 align-items-center justify-content-center p-3">

		<a th:href="@{/}" class="d-inline-flex align-items-center text-decoration-none mb-4">
			<span class="d-flex align-items-center justify-content-center bg-primary text-white rounded-pill fw-bold" style="width:36px;height:36px;">E</span>
			<span class="fw-bold fs-lg ms-2">EventsRUs</span>
		</a>

		<div class="card" style="max-width:380px;width:100%;">
			<div class="card-body text-center p-4">
				<h5 class="mb-1" th:text="${intent == 'vendor'} ? 'Vendor Login' : 'Planner Login'">Login</h5>
				<p class="text-muted fs-sm mb-4"
					th:text="${intent == 'vendor'} ? 'Sign in to manage your storefront, bookings, and subscription.' : 'Sign in to start planning your event.'">
					Sign in to continue.
				</p>

				<div id="login-error" class="alert alert-danger d-none text-start mb-3"></div>

				<div class="d-flex justify-content-center">
					<div id="g_id_onload"
						th:attr="data-client_id=${googleClientId}"
						data-callback="handleGoogleCredential"
						data-auto_prompt="false">
					</div>
					<div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="pill"></div>
				</div>

				<p class="text-muted fs-xs mt-4 mb-0">The same Google account used across the EventsRUs app.</p>
			</div>
		</div>

	</div>

	<script th:inline="javascript">
		var loginIntent = /*[[${intent}]]*/ 'planner';

		function handleGoogleCredential(response) {
			var errorBox = document.getElementById('login-error');
			errorBox.classList.add('d-none');

			var body = new URLSearchParams();
			body.set('idToken', response.credential);
			body.set('intent', loginIntent);

			fetch('/login/google', {
				method: 'POST',
				headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
				body: body.toString()
			})
				.then(function (res) { return res.json(); })
				.then(function (result) {
					if (result.success) {
						window.location.href = result.redirectTo;
					} else {
						errorBox.textContent = result.error || 'Sign-in failed. Please try again.';
						errorBox.classList.remove('d-none');
					}
				})
				.catch(function () {
					errorBox.textContent = 'Could not reach the server. Please try again.';
					errorBox.classList.remove('d-none');
				});
		}
	</script>

</body>
</html>
